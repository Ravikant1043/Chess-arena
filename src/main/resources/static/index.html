<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Arena</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ============ AUTH VIEW ============ -->
<section id="auth-view">
    <div class="auth-wrap">
        <h1>♟ Chess Arena</h1>
        <p class="sub">Real-time multiplayer chess</p>

        <div class="tabs">
            <button id="tab-login" class="active" type="button">Log in</button>
            <button id="tab-register" type="button">Register</button>
        </div>

        <form id="auth-form">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button class="primary" type="submit" id="auth-submit">Log in</button>
        </form>
        <div id="auth-msg"></div>
    </div>
</section>

<!-- ============ MAIN APP ============ -->
<section id="app-view" class="hidden">
    <div class="topbar">
        <span class="brand">♟ Chess Arena</span>
        <span class="user">
            Signed in as <b id="me-name"></b> · Score <b id="me-score">0</b>
            <button id="logout-btn" type="button">Log out</button>
        </span>
    </div>

    <!-- LOBBY -->
    <div id="lobby-view" class="container">
        <div class="panel lobby">
            <h2>Find a game</h2>
            <button id="find-btn" class="find-btn" type="button">Find Opponent</button>
            <div id="lobby-status" class="status-line"></div>

            <h2>Open challenges</h2>
            <div id="challenges"></div>
        </div>

        <div class="sidebar">
            <div class="panel" style="margin-bottom:1.25rem;">
                <h2>Online players</h2>
                <ul id="online-list" class="list"></ul>
            </div>
            <div class="panel">
                <h2>Leaderboard</h2>
                <ul id="leaderboard" class="list"></ul>
            </div>
        </div>
    </div>

    <!-- GAME -->
    <div id="game-view" class="container hidden">
        <div class="panel board-wrap" style="flex:1;">
            <div class="game-info">
                <div class="players" id="game-players"></div>
                <div class="turn" id="game-turn"></div>
            </div>
            <div id="board" class="board"></div>
            <div id="game-banner"></div>
            <button id="resign-btn" class="resign-btn" type="button">Resign</button>
            <button id="back-lobby-btn" class="resign-btn hidden" type="button" style="border-color:var(--accent);color:var(--accent);">Back to lobby</button>
        </div>
        <div class="sidebar">
            <div class="panel chat-panel">
                <h2>Chat</h2>
                <div id="chat-messages" class="chat-messages"></div>
                <form id="chat-form" class="chat-form">
                    <input id="chat-input" placeholder="Type a message…" autocomplete="off" maxlength="300">
                    <button type="submit" title="Send">➤</button>
                </form>
            </div>
        </div>
    </div>
</section>

<script src="/js/sockjs.min.js"></script>
<script src="/js/stomp.umd.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
