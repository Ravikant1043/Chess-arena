spring.application.name=chess-arena

# ---------- Server ----------
server.port=8080

# ---------- H2 Database (file-based so data survives restarts) ----------
spring.datasource.url=jdbc:h2:file:./data/chessarena;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console (dev only) -> http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Redis ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---------- JWT ----------
# HMAC-SHA256 signing key (>= 32 bytes). Override in production via env var JWT_SECRET.
app.jwt.secret=${JWT_SECRET:ThisIsADevelopmentOnlySecretKeyChangeMe123!}
# Token validity: 24 hours (in milliseconds)
app.jwt.expiration-ms=86400000

# ---------- Logging ----------
logging.level.com.chessarena=INFO
